# Garage config for the local PeerDB stack (S3-compatible AVRO staging).
# Single node, single replica, no redundancy: this is a dev/quickstart store,
# not something to point production at.
#
# The secrets below are fixed, well-known, local-only values so that the stack
# comes up deterministically without a provisioning step writing them.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
rpc_secret = "706565726462706565726462706565726462706565726462706565726462706b"

[s3_api]
s3_region = "us-east-1"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
admin_token = "peerdb-garage-admin"
