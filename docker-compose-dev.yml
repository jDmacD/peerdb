name: peerdb-quickstart-dev

# Public facing ports for services to prevent conflicts.
# Overridable using environment variables for flexibility when using multiple tilt environments
x-ports:
  - &peerdb-catalog-port      ${PEERDB_CATALOG_PORT:-9901}:5432
  - &peerdb-nexus-port        ${PEERDB_NEXUS_PORT:-9900}:9900
  - &peerdb-switchboard-port  ${PEERDB_SWITCHBOARD_PORT:-5732}:5732
  - &peerdb-ui-port           ${PEERBD_UI_PORT:-3030}:3000
  - &temporal-port            ${TEMPORAL_PORT:-7233}:7233
  - &temporal-ui-port         ${TEMPORAL_UI_PORT:-8085}:8080
  - &flow-api-grpc-port       ${FLOW_API_PORT:-8112}:8112
  - &flow-api-http-port       ${FLOW_API_HTTP_PORT:-8113}:8113
  - &flow-worker-debug-port   ${DOCKER_GO_DEBUG_PORT_FLOW_WORKER:-40001}:40000
  - &flow-snapshot-worker-debug-port ${DOCKER_GO_DEBUG_PORT_FLOW_SNAPSHOT_WORKER:-40002}:40000
  - &flow-api-debug-port      ${DOCKER_GO_DEBUG_PORT_FLOW_API:-40003}:40000
  - &garage-port              ${GARAGE_PORT:-9001}:3900
  - &garage-admin-port        ${GARAGE_ADMIN_PORT:-9002}:3903

# Garage keys must be "GK" + 12 hex bytes, and secrets 32 hex bytes, so these
# are the fixed local-only stand-ins for the old _peerdb_minioadmin pair.
x-s3-staging-config: &s3-staging-config
  # Quoted: an all-digit hex secret is otherwise parsed as a YAML float.
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ACCESS_KEY_ID: "GK706565726462706565726462"
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_SECRET_ACCESS_KEY: "07b69de97584583d57adc33683cc004ad1315bce60e2b29e9bd68e7e8fde6846"
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_REGION: us-east-1
  PEERDB_CLICKHOUSE_AWS_CREDENTIALS_AWS_ENDPOINT_URL_S3: http://host.docker.internal:${GARAGE_PORT:-9001}
  PEERDB_CLICKHOUSE_AWS_S3_BUCKET_NAME: peerdb

x-catalog-config: &catalog-config
  PEERDB_CATALOG_HOST: catalog
  PEERDB_CATALOG_PORT: 5432
  PEERDB_CATALOG_USER: postgres
  PEERDB_CATALOG_PASSWORD: postgres
  PEERDB_CATALOG_DATABASE: postgres

x-flow-worker-env: &flow-worker-env
  # For Temporal Cloud, this will look like:
  # <yournamespace>.<id>.tmprl.cloud:7233
  TEMPORAL_HOST_PORT: temporal:7233
  PEERDB_TEMPORAL_NAMESPACE: default
  # Auto-create topics for Kafka/PubSub test mirrors (the legacy CI set this on
  # the host-run worker); only queue mirrors read it.
  PEERDB_QUEUE_FORCE_TOPIC_CREATION: true
  # For the below 2 cert and key variables,
  # paste as base64 encoded strings.
  TEMPORAL_CLIENT_CERT:
  TEMPORAL_CLIENT_KEY:
  # For GCS, these will be your HMAC keys instead
  # For more information:
  # https://cloud.google.com/storage/docs/authentication/managing-hmackeys
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  # Temporary AWS Credentials for local IAM auth testing
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  # For GCS, set this to "auto" without the quotes
  AWS_REGION: ${AWS_REGION:-}
  # For GCS, set this as: https://storage.googleapis.com
  AWS_ENDPOINT: ${AWS_ENDPOINT:-}
  # enables worker profiling using Go's pprof
  ENABLE_PROFILING: "true"
  PPROF_PORT: "6060"
  # OpenTelemetry metrics export.
  # Opt-in locally — start the otel-collector resource BEFORE enabling.
  # CI enables it by listing otel-collector first among the
  # ancillary services (tilt-flow.yml).
  ENABLE_OTEL_METRICS: ${ENABLE_OTEL_METRICS:-false}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:-http://host.docker.internal:4317}
  OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: grpc
  PEERDB_OTEL_METRICS_NAMESPACE: ${PEERDB_OTEL_METRICS_NAMESPACE:-peerdb_ci_tests.}
  PEERDB_OTEL_TEMPORAL_METRICS_EXPORT_LIST: ${PEERDB_OTEL_TEMPORAL_METRICS_EXPORT_LIST:-__ALL__}
  PEERDB_OTEL_METRICS_PANIC_ON_EXPORT_FAILURE: ${PEERDB_OTEL_METRICS_PANIC_ON_EXPORT_FAILURE:-true}

services:
  catalog:
    container_name: catalog
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    command: -c config_file=/etc/postgresql.conf
    ports:
      - *peerdb-catalog-port
    environment:
      PGUSER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: --locale=C.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./volumes/postgresql.conf:/etc/postgresql.conf
      - ./volumes/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "postgres", "-U", "postgres"]
      interval: 10s
      timeout: 30s
      retries: 5
      start_period: 60s

  temporal:
    container_name: temporal
    depends_on:
      catalog:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=catalog
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    image: temporalio/auto-setup:1.29@sha256:f14912b699cf73015ad5c4fc18d522d4b014db90e794039214dfb7c022c2644f
    ports:
      - *temporal-port
    volumes:
      - ./volumes/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_CLI_SHOW_STACKS=1
    image: temporalio/admin-tools:1.25.2-tctl-1.18.1-cli-1.1.1@sha256:da0c7a7982b571857173ab8f058e7f139b3054800abb4dcb100445d29a563ee8
    stdin_open: true
    tty: true
    entrypoint: /etc/temporal/entrypoint.sh
    restart: on-failure
    healthcheck:
      test: ["CMD", "tctl", "workflow", "list"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - ./scripts/mirror-name-search.sh:/etc/temporal/entrypoint.sh

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3030
      - TEMPORAL_CSRF_COOKIE_INSECURE=true
    image: temporalio/ui:2.54.1@sha256:ff0943fe532b8e33c46cd28b29e81e0ce0b6f55b9ee50a38ef1b437cc4de3fa5
    ports:
      - *temporal-ui-port

  # applies catalog schema migrations and exits
  flow-migrate:
    container_name: flow-migrate
    image: flow-api
    build:
      context: .
      dockerfile: stacks/flow.Dockerfile
      target: flow-api
      args:
        PEERDB_VERSION_SHA_SHORT: ${PEERDB_VERSION_SHA_SHORT:-}
    entrypoint: ["/home/peerdb/peer-flow", "migrate"]
    environment:
      <<: *catalog-config
    depends_on:
      catalog:
        condition: service_healthy

  flow-api:
    container_name: flow_api
    image: flow-api
    build:
      context: .
      dockerfile: stacks/flow.Dockerfile
      target: flow-api
      args:
        PEERDB_VERSION_SHA_SHORT: ${PEERDB_VERSION_SHA_SHORT:-}
    ports:
      - *flow-api-grpc-port
      - *flow-api-http-port
      - *peerdb-switchboard-port
      - *flow-api-debug-port
    environment:
      <<: [*catalog-config, *flow-worker-env, *s3-staging-config]
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_API_REQUEST_LOGGING_ENABLED: true
      PEERDB_SWITCHBOARD_ENABLED: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  flow-snapshot-worker:
    container_name: flow-snapshot-worker
    image: flow-snapshot-worker
    build:
      context: .
      dockerfile: stacks/flow.Dockerfile
      target: flow-snapshot-worker
    ports:
      - *flow-snapshot-worker-debug-port
    environment:
      <<: [*catalog-config, *flow-worker-env, *s3-staging-config]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  flow-worker:
    container_name: flow-worker
    image: flow-worker
    build:
      context: .
      dockerfile: stacks/flow.Dockerfile
      target: flow-worker
    ports:
      - *flow-worker-debug-port
    # The below options were mentioned to be required, but it works without them, so leaving them commented out for now. If you run into issues with Delve, try uncommenting these.
    # security_opt:
    #   - "seccomp:unconfined"  # Required for Delve
    # cap_add:
    #   - SYS_PTRACE         # Required for Delve
    environment:
      <<: [*catalog-config, *flow-worker-env, *s3-staging-config]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      flow-migrate:
        condition: service_completed_successfully
      temporal-admin-tools:
        condition: service_healthy
      garage-init:
        condition: service_completed_successfully

  peerdb:
    container_name: peerdb-server
    stop_signal: SIGINT
    image: peerdb
    build:
      context: .
      dockerfile: stacks/peerdb-server.Dockerfile
      args:
        BUILD_MODE: "debug"
        CARGO_FLAGS: "--no-default-features --features mysql"
    environment:
      <<: *catalog-config
      PEERDB_PASSWORD: peerdb
      PEERDB_FLOW_SERVER_ADDRESS: grpc://flow_api:8112
      PEERDB_MIGRATIONS_DISABLED: true
      RUST_LOG: info
      RUST_BACKTRACE: 1
    ports:
      - *peerdb-nexus-port
    depends_on:
      flow-migrate:
        condition: service_completed_successfully

  peerdb-ui:
    container_name: peerdb-ui
    image: peerdb-ui
    build:
      context: .
      dockerfile: stacks/peerdb-ui.Dockerfile
      target: dev
    ports:
      - *peerdb-ui-port
    volumes:
      # Mount local ui/ directory for hot reload
      - ./ui:/app
      # Preserve node_modules from container (don't override with local)
      - /app/node_modules
    env_file:
      - path: ./.env
        required: false
    environment:
      <<: *catalog-config
      PEERDB_FLOW_SERVER_HTTP: http://flow_api:8113
      PEERDB_PASSWORD:
      NEXTAUTH_SECRET: __changeme__
      NEXTAUTH_URL: http://localhost:3030
      PEERDB_ALLOWED_TARGETS:
      PEERDB_CLICKHOUSE_ALLOWED_DOMAINS:
      PEERDB_EXPERIMENTAL_ENABLE_SCRIPTING: true
      # Fix file watching on macOS Docker volumes
      WATCHPACK_POLLING: true
      # Increase polling interval to avoid catching incomplete writes (in ms)
      WATCHPACK_POLLING_INTERVAL: 1000
    depends_on:
      - flow-api

  garage:
    image: dxflrs/garage:v2.1.0@sha256:4c9b34c113e61358466e83fd6e7d66e6d18657ede14b776eb78a93ee8da7cf6a
    command: ["/garage", "server"]
    volumes:
      - garage-data:/var/lib/garage
      - ./volumes/garage/garage.toml:/etc/garage.toml:ro
    ports:
      - *garage-port
      - *garage-admin-port

  # Garage is a scratch image with no shell, so layout/key/bucket setup runs
  # from here. Services that stage to S3 wait on this, not on garage itself.
  garage-init:
    image: curlimages/curl:8.11.1@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    restart: on-failure
    volumes:
      - ./volumes/garage/init.sh:/init.sh:ro
    environment:
      <<: *s3-staging-config
      GARAGE_ADMIN_TOKEN: peerdb-garage-admin
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      - garage

volumes:
  pgdata:
  garage-data:

networks:
  default:
    name: peerdb_network_${DEFAULT_TILT_PORT:-default}
